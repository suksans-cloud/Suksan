<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Calendar</title>
<meta name="theme-color" content="#0d1f45">
<link rel="icon" href="../portfolio/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1f45;--navy2:#142a5a;--blue:#5b9cff;--green:#1fb581;--orange:#d95d1a;--ink:#0d1f45;--mut:#7d8aa5;--soft:#f1f5fd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--navy);color:#fff;font-family:"Noto Sans Thai",system-ui,sans-serif}
.top{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 6px}
.bar{display:flex;align-items:center;justify-content:space-between;height:44px}
.bar{padding-right:96px}
.bar h1{margin:0;font:600 17px Prompt,sans-serif;letter-spacing:.3px}
.ib{width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:#fff;display:grid;place-items:center;text-decoration:none;cursor:pointer}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.nav{display:flex;align-items:center;justify-content:space-between;background:var(--navy2);border-radius:14px;height:46px;padding:0 4px;margin:8px 0 12px}
.nav b{font:500 15px Prompt,sans-serif}
.nav .today{border:0;background:#ffffff1f;color:#fff;border-radius:10px;padding:6px 10px;font:500 12px "Noto Sans Thai";margin-right:4px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.dow span{font-size:11px;color:#6f84b3;padding:6px 0 10px;letter-spacing:.5px}
.grid{row-gap:4px;padding-bottom:18px}
.d{position:relative;height:42px;display:grid;place-items:center;font-size:14px;cursor:pointer;border:0;background:none;color:#fff;font-family:inherit}
.d i{position:absolute;inset:3px 0;margin:auto;width:36px;height:36px;border-radius:50%;z-index:0}
.d span{position:relative;z-index:1}
.d.out{color:#4f6392}
.d.today i{background:var(--green)}
.d.sel i{background:var(--blue)}
.d.sel.today i{background:var(--blue);box-shadow:0 0 0 2px var(--green)}
.d u{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:3px;z-index:1}
.d u b{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.9}
.sheet{flex:1;min-height:0;overflow:auto;background:#fff;color:var(--ink);border-radius:28px 28px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.sheet:before{content:"";display:block;width:36px;height:4px;border-radius:4px;background:#d8e0ef;margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px}
.sh b{font:600 16px Prompt,sans-serif}.sh span{font-size:12px;color:var(--mut)}
.ev{display:flex;gap:12px;border-radius:18px;padding:12px;margin-bottom:10px;color:#fff;cursor:pointer}
.ev .av{flex:none;width:38px;height:38px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;font:600 15px Prompt,sans-serif}
.ev h3{margin:0;font:600 14.5px Prompt,sans-serif;line-height:1.3}
.ev p{margin:3px 0 0;font-size:12px;opacity:.9}
.ev .desc{display:none;white-space:pre-wrap;margin-top:8px;font-size:12.5px;opacity:.95}
.ev.open .desc{display:block}
.empty,.conn{text-align:center;color:var(--mut);font-size:13.5px;padding:22px 8px;line-height:1.7}
.conn{background:var(--soft);border-radius:18px;margin-bottom:12px;color:var(--ink)}
.btn{display:inline-block;margin-top:8px;border:0;border-radius:14px;background:var(--navy);color:#fff;padding:12px 20px;font:500 14px "Noto Sans Thai";cursor:pointer;text-decoration:none}
.msg{font-size:11.5px;color:#9fb0d6;text-align:center;padding:0 0 8px;min-height:16px}

.sheet{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
#fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:300 34px/1 Prompt,sans-serif;box-shadow:0 8px 22px #0d1f4559;cursor:pointer;z-index:50;display:grid;place-items:center;padding:0 0 3px}
#fab:active{transform:scale(.95)}
.ev .del{display:none;margin-top:10px;border:0;border-radius:10px;background:#ffffff33;color:#fff;padding:7px 12px;font:500 12px "Noto Sans Thai",sans-serif}
.ev.open .del{display:inline-block}
#frm{position:fixed;inset:0;background:#08122d8c;z-index:100;display:none;align-items:flex-end}
#frm.on{display:flex}
.fsheet{width:100%;max-height:92dvh;overflow:auto;background:#fff;color:var(--ink);border-radius:26px 26px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
.fsheet h2{margin:0 0 12px;font:600 17px Prompt,sans-serif}
.fsheet input[type=text],.fsheet input[type=date],.fsheet input[type=time],.fsheet textarea,.fsheet select{width:100%;border:1.5px solid #dbe3f1;border-radius:12px;padding:11px 12px;font:16px "Noto Sans Thai",sans-serif;background:#f7f9fd;color:var(--ink);margin-bottom:10px}
.fsheet small{display:block;font-size:11.5px;color:var(--mut);margin:0 0 4px 2px}
.fsheet .two{display:flex;gap:10px}.fsheet .two>div{flex:1}
.fsheet .row{display:flex;align-items:center;gap:8px;font-size:14px;margin:2px 0 12px}
.fsheet .row input{width:20px;height:20px}
.ferr{min-height:18px;color:#d12f3f;font-size:13px;font-weight:600;text-align:center}
.fbtn{display:flex;gap:10px;margin-top:6px}.fbtn .btn{flex:1;margin:0}
.btn.light{background:#e8eefb;color:var(--navy)}
.ev .mt{display:none;margin:10px 10px 0 0;color:#fff;font-size:12px;text-decoration:underline}.ev.open .mt{display:inline-block}.ev .ed{margin-right:8px}

/* ---- soft theme (V87): โทนอ่อนใกล้เคียงสีหลักของแอป ---- */
:root{--navy:#072340;--navy2:#fff;--blue:#0E8AA6;--soft:#E3F5F9;--mut:#6B7B8C}
body{background:#D9F0F5;color:#072340}
.bar{padding-right:48px}.bar h1,.ib{color:#072340}
.nav{background:#fff;box-shadow:0 1px 6px rgba(7,35,64,.07)}.nav .today{background:#C4E9F1;color:#064A5C}
.dow,.grid{grid-template-columns:30px repeat(7,1fr)}
.dow span{color:#5E8E9C}.d{color:#072340}.d.out{color:#9DBFC9}
.d.today i{background:#BFE6EF;box-shadow:inset 0 0 0 1.5px #0E8AA6}
.d.sel i,.d.sel.today i{background:#0E8AA6;box-shadow:0 4px 10px rgba(14,138,166,.35)}.d.sel{color:#fff}
.d u b{background:#0E8AA6}.d.sel u b{background:#fff}
.wk{display:grid;place-items:center;height:42px;font-size:11px;color:#5E8E9C;background:#C9E8EF;border-radius:10px;margin-right:4px}
.msg{color:#5E8E9C}.sheet{box-shadow:0 -6px 24px rgba(7,35,64,.08)}
#fab{background:#0E8AA6;box-shadow:0 8px 22px rgba(14,138,166,.4)}
.mstrip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.mstrip::-webkit-scrollbar{display:none}
.mstrip button{flex:none;border:0;border-radius:14px;padding:9px 16px;background:#fff;color:#072340;font:500 13px "Noto Sans Thai",sans-serif}
.mstrip button.on{background:#9ED8E6;color:#064A5C;font-weight:600}.mstrip .yr{flex:none;align-self:center;padding:0 6px;font:600 14px Prompt,sans-serif;color:#2E7F93}
.grid.sl{animation:gsl .2s ease}.grid.sr{animation:gsr .2s ease}
@keyframes gsl{from{transform:translateX(26px);opacity:.3}}@keyframes gsr{from{transform:translateX(-26px);opacity:.3}}


/* V93: วันนี้กึ่งกลาง / วงกลมส้ม-ม่วง / bottom sheet ลากขึ้นลง */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav>span{display:flex;align-items:center;justify-self:end}
.nav .today{height:34px;display:grid;place-items:center;padding:0 13px;line-height:1;background:#EDE6FB;color:#4B2E9A;margin-right:2px}
.nav #next{display:grid!important}
.d.today i{background:#EDE6FB;box-shadow:inset 0 0 0 2px #7C5CC4}.d.today{color:#4B2E9A}
.d.sel i,.d.sel.today i{background:#F28C28;box-shadow:0 4px 12px rgba(242,140,40,.45)}
.d.sel.today i{box-shadow:0 0 0 2px #7C5CC4,0 4px 12px rgba(242,140,40,.45)}
.d.sel,.d.sel.today{color:#fff}
.d u b{background:#7C5CC4}.d.sel u b{background:#fff}
#fab{background:#7C5CC4;box-shadow:0 8px 22px rgba(124,92,196,.42);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;flex:none;height:46vh;z-index:30;overflow-y:hidden;overscroll-behavior:contain;will-change:height;box-shadow:0 -8px 28px rgba(7,35,64,.14)}
.sheet.open{overflow-y:auto}
.sheet:before{width:44px;height:5px;margin-bottom:10px}
</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <a class="ib" href="../index.html" aria-label="กลับ"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <h1>Calendar</h1>
    <button class="ib" id="sync" aria-label="Sync Google Calendar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg></button>
  </div>
  <div class="nav">
    <button class="ib" id="prev" aria-label="เดือนก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <b id="title"></b>
    <span><button class="today" id="todayBtn">วันนี้</button><button class="ib" id="next" aria-label="เดือนถัดไป" style="display:inline-grid"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></span>
  </div>
  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
  <div class="mstrip" id="mstrip"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="sheet" id="sheet"></div>

<button id="fab" aria-label="เพิ่มนัดหมาย">+</button>
<div id="frm" role="dialog" aria-modal="true"><div class="fsheet">
  <h2 id="fH">เพิ่มนัดหมาย</h2>
  <input type="text" id="fTitle" placeholder="ชื่อนัดหมาย" maxlength="200" autocomplete="off">
  <label class="row"><input type="checkbox" id="fAll"> ทั้งวัน</label>
  <small>วันที่เริ่ม</small><input type="date" id="fDate"><small>ถึงวันที่ (เว้นว่างถ้าวันเดียว)</small><input type="date" id="fDate2">
  <div id="fTimes" class="two"><div><small>เริ่ม</small><input type="time" id="fS"></div><div><small>สิ้นสุด</small><input type="time" id="fE"></div></div>
  <input type="text" id="fLoc" placeholder="สถานที่ (ไม่บังคับ)" autocomplete="off">
  <textarea id="fDesc" rows="2" placeholder="รายละเอียด (ไม่บังคับ)"></textarea>
  <small>ทำซ้ำ</small><select id="fRep"><option value="">ไม่ทำซ้ำ</option><option value="DAILY">ทุกวัน</option><option value="WEEKLY">ทุกสัปดาห์</option><option value="MONTHLY">ทุกเดือน</option><option value="YEARLY">ทุกปี</option></select>
  <small>แจ้งเตือนก่อนเริ่ม</small><select id="fRem"><option value="">ตามค่าเริ่มต้นของปฏิทิน</option><option value="0">ตอนเริ่ม</option><option value="10">10 นาที</option><option value="30">30 นาที</option><option value="60">1 ชั่วโมง</option><option value="1440">1 วัน</option><option value="none">ไม่แจ้งเตือน</option></select>
  <small>เชิญผู้ร่วมนัด (อีเมล คั่นด้วย ,)</small><input type="text" id="fGuests" placeholder="name@gmail.com" autocomplete="off" autocapitalize="none">
  <label class="row"><input type="checkbox" id="fMeet"> เพิ่มลิงก์ Google Meet</label>
  <small>สีของนัด</small><select id="fColor"><option value="">สีของปฏิทิน</option><option value="1">ลาเวนเดอร์</option><option value="2">เสจ</option><option value="3">องุ่น</option><option value="4">ฟลามิงโก</option><option value="5">กล้วย</option><option value="6">ส้ม</option><option value="7">นกยูง</option><option value="8">กราไฟต์</option><option value="9">บลูเบอร์รี่</option><option value="10">ใบโหระพา</option><option value="11">มะเขือเทศ</option></select>
  <small>บันทึกลงปฏิทิน</small><select id="fCal"></select>
  <div class="ferr" id="fErr" role="alert"></div>
  <div class="fbtn"><button type="button" class="btn light" id="fCancel">ยกเลิก</button><button type="button" class="btn" id="fSave">บันทึก</button></div>
</div></div>
<script src="../config.js"></script>
<script src="../admin-login.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var MTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'], MS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'], PAL=['#5b9cff','#1fb581','#d95d1a','#7c5cf0','#2a4a8f'];
var CK='mff_calendar_cache_v1', TK='mff_cal_token', SCOPE='https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/calendar.events';
var EC={1:'#7986cb',2:'#33b679',3:'#8e24aa',4:'#e67c73',5:'#f6bf26',6:'#f4511e',7:'#039be5',8:'#616161',9:'#3f51b5',10:'#0b8043',11:'#d50000'};
var editing=null, today=new Date(), view=new Date(today.getFullYear(),today.getMonth(),1), sel=new Date(today.getFullYear(),today.getMonth(),today.getDate());
var cache=load(), apiHelp='';
function load(){try{return JSON.parse(localStorage.getItem(CK))||{months:{},updated:0}}catch(e){return {months:{},updated:0}}}
function save(){try{localStorage.setItem(CK,JSON.stringify(cache))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function key(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function mkey(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
function hm(ms){var d=new Date(ms);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function msg(t){$('msg').textContent=t||''}
function gridStart(d){var s=new Date(d.getFullYear(),d.getMonth(),1);s.setDate(1-s.getDay());return s}
function isoWeek(t){var x=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())),n=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-n);var y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil(((x-y)/864e5+1)/7)}

// ---- events by day ----
function dayMap(){
  var map={};
  Object.keys(cache.months).forEach(function(m){cache.months[m].forEach(function(e){
    var s=new Date(e.s), en=new Date(e.e), last=e.ad?new Date(en.getTime()-1):en;
    for(var d=new Date(s.getFullYear(),s.getMonth(),s.getDate()),n=0;d<=last&&n<62;d.setDate(d.getDate()+1),n++){
      var k=key(d);(map[k]=map[k]||[]);
      if(!map[k].some(function(x){return x.id===e.id&&x.s===e.s}))map[k].push(e);
    }});});
  Object.keys(map).forEach(function(k){map[k].sort(function(a,b){return (b.ad-a.ad)||(a.s-b.s)})});
  return map;
}

// ---- render ----
function render(){
  $('title').textContent=MTH[view.getMonth()]+' '+(view.getFullYear()+543);
  var map=dayMap(), g=$('grid'), h='', d=gridStart(view), tk=key(today), sk=key(sel);
  for(var i=0;i<42;i++,d.setDate(d.getDate()+1)){
    if(i%7===0)h+='<span class="wk">'+isoWeek(new Date(d.getFullYear(),d.getMonth(),d.getDate()+4))+'</span>';
    var k=key(d), ev=map[k]||[], cls='d'+(d.getMonth()!==view.getMonth()?' out':'')+(k===tk?' today':'')+(k===sk?' sel':'');
    h+='<button class="'+cls+'" data-k="'+k+'"><i></i><span>'+d.getDate()+'</span>'+(ev.length?'<u>'+ev.slice(0,3).map(function(){return '<b></b>'}).join('')+'</u>':'')+'</button>';
  }
  g.innerHTML=h;
  var list=map[sk]||[], hs='';
  var tok=token();
  if(!tok&&!cache.updated) hs+='<div class="conn">ยังไม่ได้เชื่อมต่อ Google Calendar<br>ระบบขอสิทธิ์อ่านอย่างเดียว (readonly) เมื่อกดปุ่มเท่านั้น<br><button class="btn" id="connect">เชื่อมต่อ Google Calendar</button></div>';
  if(apiHelp) hs+='<div class="conn">ต้องเปิดใช้ Google Calendar API ในโปรเจกต์ Google Cloud ก่อน<br><a class="btn" target="_blank" rel="noopener" href="'+esc(apiHelp)+'">เปิดหน้าเปิดใช้ API</a><br><small>เปิดแล้วรอ 1-2 นาที แล้วกด Sync อีกครั้ง</small></div>';
  hs+='<button type="button" class="btn light" id="dcaBtn" style="width:100%;margin:0 0 12px">💰 ตั้งเตือน DCA รายเดือน</button>';
  hs+='<div class="sh"><b>'+sel.getDate()+' '+MTH[sel.getMonth()]+'</b><span>'+list.length+' รายการ'+(cache.updated?' · อัปเดต '+hm(cache.updated):'')+'</span></div>';
  if(!list.length) hs+='<div class="empty">ไม่มีนัดหมายในวันนี้</div>';
  list.forEach(function(e,i){
    var t=e.ad?'ทั้งวัน':hm(e.s)+' - '+hm(e.e);
    hs+='<div class="ev" data-i="'+i+'" style="background:'+esc(e.c)+'"><div class="av">'+esc((e.t||'?').trim().charAt(0).toUpperCase())+'</div><div style="min-width:0"><h3>'+esc(e.t)+'</h3><p>'+t+(e.l?' · '+esc(e.l):'')+'</p>'+(e.d?'<div class="desc">'+esc(e.d.replace(/<[^>]*>/g,' '))+'</div>':'')+(e.mt?'<a class="mt" href="'+esc(e.mt)+'" target="_blank" rel="noopener">เข้าร่วม Google Meet</a>':'')+(e.w?'<button class="del ed" data-i="'+i+'">แก้ไข</button><button class="del" data-i="'+i+'">ลบนัดนี้</button>':'')+'</div></div>';
  });
  $('sheet').innerHTML=hs;
}

// ---- Google auth (only when the user taps connect / sync) ----
function token(){try{var t=JSON.parse(sessionStorage.getItem(TK)||'null');return t&&t.exp>Date.now()+30000?t.v:null}catch(e){return null}}
function canWrite(){try{var t=JSON.parse(sessionStorage.getItem(TK)||'null');return !!(t&&t.w&&t.exp>Date.now()+30000)}catch(e){return false}}
function loadGIS(){return new Promise(function(res,rej){
  if(window.google&&google.accounts&&google.accounts.oauth2)return res();
  var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=function(){res()};s.onerror=function(){rej(new Error('gis'))};document.head.appendChild(s);});}
function connect(after){
  var cid=localStorage.getItem('google_client_id');
  if(!cid){msg('ยังไม่มี Client ID — ตั้งค่าที่ Settings ก่อน');$('sheet').insertAdjacentHTML('afterbegin','<div class="conn">ยังไม่ได้ตั้งค่า Google OAuth Client ID<br><a class="btn" href="../settings/index.html">ไปที่ Settings</a></div>');return}
  msg('กำลังเชื่อมต่อ...');
  loadGIS().then(function(){
    google.accounts.oauth2.initTokenClient({client_id:cid,scope:SCOPE,callback:function(r){
      if(r.error){msg('เชื่อมต่อไม่สำเร็จ: '+r.error);return}
      sessionStorage.setItem(TK,JSON.stringify({v:r.access_token,exp:Date.now()+(r.expires_in||3600)*1000,w:1}));
      localStorage.setItem('mff_calendar_connected_v2','1');if(after)after();else sync();
    }}).requestAccessToken({prompt:localStorage.getItem('mff_calendar_connected_v2')?'':'consent'});
  }).catch(function(){msg('โหลด Google ไม่ได้ ตรวจสอบอินเทอร์เน็ต')});
}
function api(url,tok){return fetch(url,{headers:{Authorization:'Bearer '+tok}}).then(function(r){
  if(r.status===401){sessionStorage.removeItem(TK);throw new Error('expired')}
  if(!r.ok)return r.json().then(function(j){throw new Error((j.error&&j.error.message)||r.status)});return r.json()})}

function sync(){
  var tok=token(); if(!tok){connect();return}
  var btn=$('sync');btn.classList.add('spin');msg('กำลังดึงข้อมูล...');

  api('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader',tok).then(function(cl){
    var cals=(cl.items||[]).filter(function(c){return c.selected!==false}).slice(0,12);
    cache.cals=cals.map(function(c){return {id:c.id,n:c.summaryOverride||c.summary||c.id,w:c.accessRole==='owner'||c.accessRole==='writer',p:!!c.primary}});
    var HOL='th.th#holiday@group.v.calendar.google.com';
    if(!cals.some(function(c){return /#holiday@group\.v\.calendar\.google\.com$/.test(c.id)}))cals.push({id:HOL,hol:true,accessRole:'reader'});
    return Promise.all(cals.map(function(c,ci){
      return api('https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(c.id)+'/events?'+q,tok).then(function(r){
        return (r.items||[]).filter(function(x){return x.status!=='cancelled'}).map(function(x){
          var ad=!!(x.start&&x.start.date);
          var st=new Date(ad?x.start.date+'T00:00:00':x.start.dateTime).getTime(), en=new Date(ad?x.end.date+'T00:00:00':x.end.dateTime).getTime();
          return {id:x.id,t:x.summary||'(ไม่มีชื่อ)',s:st,e:en,ad:ad,l:x.location||'',d:x.description||'',c:(/#holiday@group\.v\.calendar\.google\.com$/.test(c.id)?'#d95d1a':((x.colorId&&EC[x.colorId])||PAL[ci%PAL.length])),cid:c.id,w:c.accessRole==='owner'||c.accessRole==='writer',ci:x.colorId||'',at:(x.attendees||[]).map(function(a){return a.email}),mt:x.hangoutLink||''};
        });}).catch(function(er){if(c.hol)return [];throw er});
    }));
  }).then(function(parts){
    cache.months[mkey(view)]=[].concat.apply([],parts);cache.updated=Date.now();apiHelp='';save();msg('ซิงค์สำเร็จ');render();
  }).catch(function(err){
    var m=String(err.message||'');
    if(/has not been used|is disabled|accessNotConfigured/i.test(m)){
      var u=(m.match(/https:\/\/console\.developers\.google\.com\S+?(?=\s|$)/)||['https://console.developers.google.com/apis/library/calendar-json.googleapis.com'])[0];
      apiHelp=u;msg('ยังไม่ได้เปิดใช้ Calendar API');
    } else msg(m==='expired'?'หมดอายุ กดซิงค์เพื่อเชื่อมต่อใหม่':'ซิงค์ไม่สำเร็จ: '+m);
    render();})
  .then(function(){btn.classList.remove('spin')});
}

function saveEv(){
  var E=editing,t=$('fTitle').value.trim(),d=$('fDate').value,d2=$('fDate2').value||d,all=$('fAll').checked,err=$('fErr'),b={summary:t};
  if(!t){err.textContent='กรุณาใส่ชื่อนัดหมาย';return}
  if(!d){err.textContent='กรุณาเลือกวันที่';return}
  if(d2<d){err.textContent='วันที่สิ้นสุดต้องไม่ก่อนวันเริ่ม';return}
  b.location=$('fLoc').value.trim();b.description=$('fDesc').value.trim();
  if(all){var nx=new Date(d2+'T00:00:00');nx.setDate(nx.getDate()+1);b.start={date:d};b.end={date:key(nx)};if(E){b.start.dateTime=null;b.start.timeZone=null;b.end.dateTime=null;b.end.timeZone=null}}
  else{if(d2+'T'+$('fE').value<=d+'T'+$('fS').value){err.textContent='เวลาสิ้นสุดต้องหลังเวลาเริ่ม';return}
    b.start={dateTime:d+'T'+$('fS').value+':00',timeZone:TZ};b.end={dateTime:d2+'T'+$('fE').value+':00',timeZone:TZ};if(E){b.start.date=null;b.end.date=null}}
  var em=$('fGuests').value.split(/[,;\s]+/).filter(Boolean);
  if(em.some(function(x){return !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)})){err.textContent='รูปแบบอีเมลผู้ร่วมนัดไม่ถูกต้อง';return}
  if(em.length||E)b.attendees=em.map(function(x){return {email:x}});
  if(!E&&$('fRep').value)b.recurrence=['RRULE:FREQ='+$('fRep').value];
  var rv=$('fRem').value;if(rv==='none')b.reminders={useDefault:false,overrides:[]};else if(rv!=='')b.reminders={useDefault:false,overrides:[{method:'popup',minutes:+rv}]};
  if(E)b.colorId=$('fColor').value||null;else if($('fColor').value)b.colorId=$('fColor').value;
  if($('fMeet').checked&&!(E&&E.mt))b.conferenceData={createRequest:{requestId:'mff'+Date.now(),conferenceSolutionKey:{type:'hangoutsMeet'}}};
  var tok=token();if(!tok||!canWrite()){connect(saveEv);return}
  var url='https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(E?E.cid:$('fCal').value)+'/events'+(E?'/'+encodeURIComponent(E.id):'')+'?conferenceDataVersion=1&sendUpdates='+(em.length?'all':'none');
  var btn=$('fSave');btn.disabled=true;err.textContent='';
  fetch(url,{method:E?'PATCH':'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(b)})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return j})})
  .then(function(){var p=d.split('-');sel=new Date(+p[0],+p[1]-1,+p[2]);view=new Date(sel.getFullYear(),sel.getMonth(),1);closeForm();msg(E?'บันทึกการแก้ไขแล้ว':'เพิ่มนัดหมายแล้ว');sync()})
  .catch(function(e){err.textContent='บันทึกไม่สำเร็จ: '+e.message})
  .then(function(){btn.disabled=false});
}
function delEv(i){

  .catch(function(er){msg('ลบไม่สำเร็จ: '+er.message)});
}

(function(){
  var sh=$('sheet'),mode=0,t0=null;
  function dims(){var m=$('msg').getBoundingClientRect().bottom,bar=document.querySelector('.bar').getBoundingClientRect().bottom,H=window.innerHeight,peek=Math.max(170,H-m-4);return [peek,Math.max(peek+40,H-bar-6)]}
  function set(h,anim){sh.style.transition=anim?'height .24s cubic-bezier(.2,.8,.2,1)':'none';sh.style.height=h+'px'}
  function snap(m,anim){mode=m;set(dims()[m],anim!==false);sh.classList.toggle('open',m===1);if(m===0)sh.scrollTop=0}
  window.mffSheet={snap:snap};
  window.addEventListener('resize',function(){snap(mode,false)});window.addEventListener('load',function(){snap(mode,false)});
  var _r=render;render=function(){_r();if(mode===0)setTimeout(function(){snap(0,false)},0)};
  sh.addEventListener('touchstart',function(e){var t=e.touches[0];t0={y:t.clientY,x:t.clientX,top:t.clientY-sh.getBoundingClientRect().top,h:sh.offsetHeight,drag:null}},{passive:true});
  sh.addEventListener('touchmove',function(e){if(!t0)return;var t=e.touches[0],dy=t.clientY-t0.y,dx=t.clientX-t0.x;
    if(t0.drag===null){if(Math.abs(dy)<6&&Math.abs(dx)<6)return;
      if(Math.abs(dx)>Math.abs(dy)){t0.drag=false;return}
      t0.drag=mode===0?true:((t0.top<56||sh.scrollTop<=0)&&dy>0)}
    if(t0.drag){e.preventDefault();var d=dims();set(Math.min(d[1],Math.max(d[0]*.75,t0.h-dy)),false)}},{passive:false});
  sh.addEventListener('touchend',function(){if(!t0)return;var was=t0.drag;t0=null;if(!was)return;var d=dims(),h=sh.offsetHeight;
    snap(mode===0?(h>d[0]+50?1:0):(h<d[1]-80?0:1))});
  sh.addEventListener('click',function(e){if(e.target===sh&&e.clientY-sh.getBoundingClientRect().top<30)snap(mode?0:1)});
  setTimeout(function(){snap(0,false)},60);
})();
})();
