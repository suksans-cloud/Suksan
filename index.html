<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Family Funds — เมนูหลัก</title>
<meta name="theme-color" content="#072340">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="portfolio/icon-192.png">
<link rel="icon" href="portfolio/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
</head>
<body>

<div class="mff-app">

  <div class="mff-hero-wrap">
    <div class="mff-topbar">
      <span></span>
      <div class="dots" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
      </div>
    </div>

    <div class="mff-hero">
      <p class="eyebrow" id="mffGreetLine">สวัสดี 👋</p>
      <h1>เลือกเมนูที่ต้องการ<br>ใช้งานได้เลย</h1>
    </div>

    <svg class="wave" viewBox="0 0 460 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,30 C 80,55 160,10 240,28 C 320,46 400,15 460,32 L460,60 L0,60 Z" fill="#ffffff" opacity="0.07"/>
      <path d="M0,40 C 90,60 170,25 250,38 C 330,50 400,22 460,40 L460,60 L0,60 Z" fill="#ffffff" opacity="0.1"/>
    </svg>
  </div>

  <div class="mff-grid">

    <a class="mff-card" href="profile/index.html">
      <span class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
      </span>
      <h3>My Profile</h3>
      <p>ข้อมูลสมาชิกในครอบครัว รูปถ่ายและรายละเอียดส่วนตัว</p>
    </a>

    <a class="mff-card" href="portfolio/index.html">
      <span class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-8"/><path d="M4 19h16"/><path d="M13 6l4.5-2.5L21 6"/><path d="M17.5 3.5V7h3.5"/></svg>
      </span>
      <h3>My Portfolio</h3>
      <p>พอร์ตกองทุนครอบครัว กราฟและแดชบอร์ด</p>
    </a>

    <a class="mff-card" href="bookshelf/index.html">
      <span class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5C4 4 4.6 3.6 5.3 3.6H10a2 2 0 0 1 2 2V20a2 2 0 0 0-2-1.6H4z"/><path d="M20 4.5c0-.5-.6-.9-1.3-.9H14a2 2 0 0 0-2 2V20a2 2 0 0 1 2-1.6h6z"/></svg>
      </span>
      <h3>My Bookshelf</h3>
      <p>คลังหนังสือครอบครัว ค้นหาและยืมอ่านได้</p>
    </a>

    <a class="mff-card" href="money/index.html">
      <span class="icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><circle cx="7" cy="14.2" r="1.1" fill="currentColor" stroke="none"/></svg>
      </span>
      <h3>My Money</h3>
      <p>สรุปรายรับรายจ่าย</p>
    </a>

  </div>

</div>

<nav class="mff-bottomnav">
  <a class="mff-navbtn active" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
    หน้าแรก
  </a>
  <button type="button" class="mff-navbtn" id="navSearchBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    ค้นหา
  </button>
  <button type="button" class="mff-navbtn" id="navNotifBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M9.5 20a2.5 2.5 0 0 0 5 0"/></svg>
    <span id="notifBadge" class="mff-badge-dot" hidden></span>
    แจ้งเตือน
  </button>
  <a class="mff-navbtn" href="settings/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Setting
  </a>
</nav>

<script src="data-safety.js"></script>
<script>
(function(){
  var h=new Date().getHours();
  var g=h<11?'อรุณสวัสดิ์ ☀️':h<17?'สวัสดีตอนบ่าย 👋':'สวัสดีตอนเย็น 🌙';
  var el=document.getElementById('mffGreetLine');
  if(el) el.textContent=g;
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ===================== ค้นหา + แจ้งเตือน (bottom nav) =====================
   ทั้งสองฟีเจอร์อ่านจาก localStorage cache ที่แต่ละโมดูลเก็บไว้ในเครื่องนี้
   (โมดูลไหนยังไม่เคยเปิดก็จะยังไม่มี cache — ถือว่ายังไม่มีข้อมูล) ไม่ยิง
   network เพิ่มและไม่ผูกกับ Google Sheets โดยตรง จึงเปิดได้เร็วและออฟไลน์ได้ */
(function(){
  'use strict';
  function esc(s){return String(s==null?'':s).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
  function readJSON(key,fallback){ try{ var raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }

  function openSheet(title,bodyHtml){
    closeSheet();
    var o=document.createElement('div'); o.className='mff-sheet-overlay'; o.id='mffSheetOverlay';
    o.innerHTML='<div class="mff-sheet-card">'+
      '<div class="mff-sheet-head"><h3>'+esc(title)+'</h3><button type="button" class="mff-sheet-close" id="mffSheetCloseBtn">×</button></div>'+
      '<div class="mff-sheet-body" id="mffSheetBody">'+bodyHtml+'</div>'+
    '</div>';
    document.body.appendChild(o);
    o.addEventListener('click',function(e){ if(e.target===o) closeSheet(); });
    document.getElementById('mffSheetCloseBtn').onclick=closeSheet;
    return o;
  }
  function closeSheet(){ var o=document.getElementById('mffSheetOverlay'); if(o) o.remove(); }

  /* ---------- ค้นหา ---------- */
  function monthLabelTH(key){
    var THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    var parts=String(key||'').split('-'); var y=Number(parts[0]),m=Number(parts[1]);
    if(!y||!m) return key||'';
    return THAI_MONTHS[m-1]+' '+(y+543);
  }
  function collectSearchIndex(){
    var groups=[];

    var profiles=readJSON('mff_profiles_cache_v1',null);
    if(Array.isArray(profiles)){
      groups.push({key:'profile',title:'My Profile',icon:'👤',href:'profile/index.html',
        items:profiles.map(function(p){ return {label:((p.firstName||'')+' '+(p.lastName||'')).trim()||'(ไม่มีชื่อ)', sub:p.relation||p.phone||''}; })});
    }

    var portfolio=readJSON('khlangthun_portfolio_oldui_latest_v4',null);
    if(portfolio && Array.isArray(portfolio.funds)){
      groups.push({key:'portfolio',title:'My Portfolio',icon:'📊',href:'portfolio/index.html',
        items:portfolio.funds.map(function(f){ return {label:f.name||f.id||'(กองทุน)', sub:f.owner?('เจ้าของ: '+f.owner):''}; })});
    }

    var books=readJSON('mff_bookshelf_cache_v1',null);
    if(Array.isArray(books)){
      groups.push({key:'bookshelf',title:'My Bookshelf',icon:'📚',href:'bookshelf/index.html',
        items:books.map(function(b){ return {label:b.title||'(ไม่มีชื่อ)', sub:b.status||''}; })});
    }

    var money=readJSON('mff_money_cache_v3',null);
    if(Array.isArray(money)){
      var seen={}, uniq=[];
      money.forEach(function(t){
        var k=(t.category||'')+'|'+(t.type||'');
        if(t.category && !seen[k]){ seen[k]=true; uniq.push({label:t.category, sub:monthLabelTH(t.month)+' • ฿'+(Number(t.amount)||0).toLocaleString('th-TH')}); }
      });
      groups.push({key:'money',title:'My Money',icon:'💰',href:'money/monthly.html',items:uniq});
    }

    return groups;
  }
  function renderSearchResults(term){
    var groups=collectSearchIndex();
    var hasAnyCache=groups.length>0;
    term=(term||'').trim().toLowerCase();
    var resultsEl=document.getElementById('mffSearchResults');
    if(!resultsEl) return;
    if(!term){
      resultsEl.innerHTML='<div class="mff-search-empty">พิมพ์ชื่อคน กองทุน หนังสือ หรือหมวดรายจ่าย เพื่อค้นหาในทุกโมดูล'+(hasAnyCache?'':'<br><br>ยังไม่มีข้อมูลให้ค้นหา — ลองเปิดใช้งานแต่ละโมดูลก่อนสักครั้ง')+'</div>';
      return;
    }
    var html='', found=0;
    groups.forEach(function(g){
      var matches=g.items.filter(function(it){ return (it.label||'').toLowerCase().indexOf(term)!==-1 || (it.sub||'').toLowerCase().indexOf(term)!==-1; }).slice(0,8);
      if(!matches.length) return;
      found+=matches.length;
      html+='<div class="mff-search-group"><h4>'+esc(g.title)+'</h4>'+
        matches.map(function(it){
          return '<a class="mff-search-item" href="'+g.href+'"><span class="ic">'+g.icon+'</span><span class="tx"><b>'+esc(it.label)+'</b>'+(it.sub?'<span>'+esc(it.sub)+'</span>':'')+'</span></a>';
        }).join('')+
      '</div>';
    });
    resultsEl.innerHTML=found?html:'<div class="mff-search-empty">ไม่พบรายการที่ตรงกับ "'+esc(term)+'"</div>';
  }
  function openSearch(){
    openSheet('ค้นหา',
      '<div class="mff-search-box">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>'+
        '<input id="mffSearchInput" placeholder="ค้นหาคน กองทุน หนังสือ รายจ่าย..." autocomplete="off">'+
      '</div><div id="mffSearchResults"></div>');
    var input=document.getElementById('mffSearchInput');
    var timer=null;
    input.addEventListener('input',function(){ clearTimeout(timer); var v=input.value; timer=setTimeout(function(){ renderSearchResults(v); },200); });
    renderSearchResults('');
    setTimeout(function(){ input.focus(); },150);
  }

  /* ---------- แจ้งเตือน ---------- */
  function monthKeyNow(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  function buildNotifications(){
    var list=[];

    var sheetsConnected = localStorage.getItem('google_sheets_connected')==='1';
    if(!sheetsConnected){
      list.push({level:'warn', icon:'⚠️', title:'ยังไม่ได้เชื่อมต่อ Google Sheets',
        text:'ข้อมูลจะถูกเก็บในเครื่องนี้เท่านั้น ไปเชื่อมต่อได้จากหน้าโมดูลใดก็ได้ (ปุ่ม "เชื่อมต่อ")', href:null});
    }

    var money=readJSON('mff_money_cache_v3',null);
    if(Array.isArray(money)){
      var mk=monthKeyNow();
      var hasThisMonth=money.some(function(t){ return t.month===mk; });
      if(!hasThisMonth){
        list.push({level:'warn', icon:'💰', title:'ยังไม่ได้บันทึกรายรับ-รายจ่ายเดือนนี้',
          text:'ไปกรอกข้อมูลเดือนนี้ที่ My Money ได้เลย', href:'money/monthly.html', hrefLabel:'ไปที่ My Money →'});
      }
    }

    var profiles=readJSON('mff_profiles_cache_v1',null);
    if(Array.isArray(profiles) && profiles.length===0){
      list.push({level:'info', icon:'👤', title:'ยังไม่มีข้อมูลสมาชิกครอบครัว',
        text:'เพิ่มสมาชิกคนแรกได้ที่ My Profile', href:'profile/index.html', hrefLabel:'ไปที่ My Profile →'});
    }

    var portfolio=readJSON('khlangthun_portfolio_oldui_latest_v4',null);
    if(portfolio && Array.isArray(portfolio.funds) && portfolio.funds.length===0){
      list.push({level:'info', icon:'📊', title:'ยังไม่มีกองทุนในพอร์ต',
        text:'เพิ่มกองทุนแรกได้ที่ My Portfolio', href:'portfolio/index.html', hrefLabel:'ไปที่ My Portfolio →'});
    }

    var books=readJSON('mff_bookshelf_cache_v1',null);
    if(Array.isArray(books) && books.length===0){
      list.push({level:'info', icon:'📚', title:'ชั้นหนังสือยังว่างอยู่',
        text:'เพิ่มหนังสือเล่มแรกได้ที่ My Bookshelf', href:'bookshelf/index.html', hrefLabel:'ไปที่ My Bookshelf →'});
    }

    return list;
  }
  function renderNotifBadge(){
    var list=buildNotifications();
    var badge=document.getElementById('notifBadge');
    if(!badge) return;
    if(list.length){ badge.hidden=false; badge.textContent=list.length>9?'9+':String(list.length); }
    else { badge.hidden=true; }
  }
  function openNotifications(){
    var list=buildNotifications();
    var html = list.length
      ? list.map(function(n){
          return '<div class="mff-notif-item '+(n.level==='warn'?'warn':'info')+'"><span class="ic">'+n.icon+'</span><span class="tx"><b>'+esc(n.title)+'</b><span>'+esc(n.text)+'</span>'+(n.href?('<br><a href="'+n.href+'">'+esc(n.hrefLabel||'ไปที่หน้านั้น →')+'</a>'):'')+'</span></div>';
        }).join('')
      : '<div class="mff-notif-empty">ไม่มีการแจ้งเตือนใหม่ 🎉</div>';
    openSheet('แจ้งเตือน', html);
  }

  document.getElementById('navSearchBtn').addEventListener('click', openSearch);
  document.getElementById('navNotifBtn').addEventListener('click', openNotifications);
  renderNotifBadge();
  window.addEventListener('storage', renderNotifBadge);
})();
</script>

</body>
</html>
