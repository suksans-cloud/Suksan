<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money — My Family Funds</title>
<meta name="theme-color" content="#072340">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<style>
.mff-money-hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px 4px}
.mff-money-hub-tile{
  background:var(--surface);box-shadow:var(--shadow-card);border-radius:20px;padding:18px 14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-decoration:none;color:var(--ink);
}
.mff-money-hub-tile .ic{
  width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.mff-money-hub-tile h3{margin:0;font-size:14.5px;font-weight:700}
.mff-money-hub-tile p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.4}

.mff-money-summary-wrap{margin:16px 20px 20px}
</style>
</head>
<body>

<div class="mff-app" style="padding-bottom:20px">

  <div class="mff-hero-wrap" style="padding-bottom:20px;border-radius:0 0 28px 28px">
    <div class="mff-topbar">
      <a class="back" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5 8 12l7 7"/></svg>
        หน้าแรก
      </a>
      <span></span>
    </div>
    <div class="mff-hero" style="padding-top:0">
      <p class="eyebrow" style="margin-bottom:2px">My Money</p>
      <h1 style="font-size:19px;white-space:nowrap">รายรับ-รายจ่ายครอบครัว</h1>
    </div>
  </div>

  <!-- 1 & 2: ค่าใช้จ่ายรายวัน / ค่าใช้จ่ายรายเดือน -->
  <div class="mff-money-hub-grid">
    <a class="mff-money-hub-tile" href="daily.html">
      <span class="ic">📆</span>
      <h3>ค่าใช้จ่ายรายวัน</h3>
      <p>บันทึกค่าใช้จ่ายแต่ละวัน แยกตามหมวดหมู่</p>
    </a>
    <a class="mff-money-hub-tile" href="monthly.html">
      <span class="ic">📊</span>
      <h3>ค่าใช้จ่ายรายเดือน</h3>
      <p>งบประมาณรายรับ-รายจ่ายทั้งเดือน</p>
    </a>
  </div>

  <!-- 3: สรุปยอด — ดึงข้อมูลชุดเดียวกับการ์ด "สรุป" ในหน้าค่าใช้จ่ายรายวัน (รายวัน/รายสัปดาห์/รายเดือน/ยอดคงเหลือ) -->
  <div class="mff-money-summary-wrap">
    <div class="mff-sheet">
      <div class="mff-sheet-head summary">สรุป</div>
      <div class="mff-sheet-row total"><span class="nm">รายจ่ายรายวัน</span><span class="amt" id="sumDaily">฿0</span></div>
      <div class="mff-sheet-row total"><span class="nm" id="sumWeekLabel">รายจ่ายรายสัปดาห์</span><span class="amt" id="sumWeek">฿0</span></div>
      <div class="mff-sheet-row total"><span class="nm" id="sumMonthLabel">รายจ่ายรายเดือน</span><span class="amt" id="sumMonth">฿0</span></div>
      <div class="mff-sheet-row total"><span class="nm">ยอดคงเหลือ</span><span class="amt" id="sumBalance">฿0</span></div>
    </div>
  </div>

</div>

<script src="../config.js"></script>
<script src="../data-safety.js"></script>
<script src="../portfolio/auth-open.js"></script>
<script>
(function(){
'use strict';
function fmtBaht(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabelTH(key){
  const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y,m]=key.split('-').map(Number);
  return THAI_MONTHS[m-1]+' '+(y+543);
}
function readJSON(key,fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function shiftDate(key,delta){
  const [y,m,dd]=key.split('-').map(Number);
  const d=new Date(y, m-1, dd+delta);
  return dateKey(d);
}
/* สัปดาห์แบบ จันทร์-อาทิตย์ — สูตรเดียวกับหน้าค่าใช้จ่ายรายวัน */
function startOfWeek(dkey){
  const [y,m,dd]=dkey.split('-').map(Number);
  const d=new Date(y,m-1,dd);
  const dow=d.getDay();
  const diffToMon = dow===0 ? -6 : 1-dow;
  d.setDate(d.getDate()+diffToMon);
  return dateKey(d);
}
function endOfWeek(dkey){ return shiftDate(startOfWeek(dkey), 6); }
function weekLabel(dkey){
  const s=startOfWeek(dkey), e=endOfWeek(dkey);
  const [,sm,sd]=s.split('-').map(Number);
  const [,em,ed]=e.split('-').map(Number);
  const TH=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return sd+' '+TH[sm-1]+' – '+ed+' '+TH[em-1];
}

const today = dateKey(new Date());
const thisMonthKey = monthKey(new Date());
const weekStart = startOfWeek(today), weekEnd = endOfWeek(today);

/* ---- ค่าใช้จ่ายรายวัน: อ่านจาก cache ของหน้า daily.html (ชุดข้อมูลเดียวกับการ์ด "สรุป" ในหน้านั้น) ---- */
const dailyEntries = readJSON('mff_daily_cache_v1', []);
const dailyToday = dailyEntries.filter(e=>e.date===today).reduce((s,e)=>s+(Number(e.amount)||0),0);
const dailyWeek = dailyEntries.filter(e=>e.date>=weekStart && e.date<=weekEnd).reduce((s,e)=>s+(Number(e.amount)||0),0);
const dailyMonthTotal = dailyEntries.filter(e=>(e.date||'').slice(0,7)===thisMonthKey).reduce((s,e)=>s+(Number(e.amount)||0),0);

/* ---- ค่าใช้จ่ายรายเดือน (รายรับ/รายจ่ายประจำ) + รวมรายจ่ายรายวันสะสมของเดือนนี้เข้าไปในยอดรายจ่าย ---- */
const monthItems = readJSON('mff_money_cache_v3', []);
let income=0, monthlyExpense=0;
monthItems.forEach(t=>{
  if(t.month!==thisMonthKey) return;
  const amt=Number(t.amount)||0;
  if(t.type==='income') income+=amt; else monthlyExpense+=amt;
});
const totalExpense = monthlyExpense + dailyMonthTotal;
const balance = income - totalExpense;

document.getElementById('sumDaily').textContent = '฿'+fmtBaht(dailyToday);
document.getElementById('sumWeekLabel').textContent = 'รายจ่ายรายสัปดาห์ ('+weekLabel(today)+')';
document.getElementById('sumWeek').textContent = '฿'+fmtBaht(dailyWeek);
document.getElementById('sumMonthLabel').textContent = 'รายจ่ายรายเดือน ('+monthLabelTH(thisMonthKey)+')';
document.getElementById('sumMonth').textContent = '฿'+fmtBaht(totalExpense);
const balEl=document.getElementById('sumBalance');
balEl.textContent = (balance<0?'-':'')+'฿'+fmtBaht(Math.abs(balance));
balEl.className = 'amt '+(balance>=0?'pos':'neg');
})();
</script>

</body>
</html>
