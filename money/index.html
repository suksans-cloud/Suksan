<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money — My Family Funds</title>
<meta name="theme-color" content="#0F5B4D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<style>
.mff-money-hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px 4px}
.mff-money-hub-tile{
  background:var(--surface);box-shadow:var(--shadow-card);border-radius:20px;padding:18px 14px;
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-decoration:none;color:var(--ink);
}
.mff-money-hub-tile .ic{
  width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.mff-money-hub-tile h3{margin:0;font-size:14.5px;font-weight:700}
.mff-money-hub-tile p{margin:0;font-size:11.5px;color:var(--ink-soft);line-height:1.4}

.mff-money-summary{margin:16px 20px 20px;background:var(--surface);box-shadow:var(--shadow-card);border-radius:20px;padding:18px}
.mff-money-summary h2{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.mff-money-summary-row{display:grid;grid-template-columns:minmax(0,1fr) var(--money-amt-col,132px);column-gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:42px;box-sizing:border-box}
.mff-money-summary-row:last-child{border-bottom:0;padding-bottom:0}
.mff-money-summary-row .nm{font-size:12.5px;color:var(--ink-soft);min-width:0;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mff-money-summary-row .amt{display:block;width:var(--money-amt-col,132px);box-sizing:border-box;font-size:15px;font-weight:700;text-align:right;white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums lining-nums;line-height:1.25;overflow:hidden;text-overflow:clip}
.mff-money-summary-row .amt.pos{color:var(--income)}
.mff-money-summary-row .amt.neg{color:var(--expense)}
.mff-money-summary-divider{font-size:11px;color:var(--ink-faint);font-weight:700;margin:14px 0 2px;text-transform:uppercase;letter-spacing:.03em}
@media(max-width:360px){.mff-money-summary{padding:16px 14px;--money-amt-col:118px}.mff-money-summary-row{grid-template-columns:minmax(0,1fr) var(--money-amt-col);column-gap:8px}.mff-money-summary-row .amt{width:var(--money-amt-col);font-size:13.5px;letter-spacing:-.15px}}
@media(max-width:320px){.mff-money-summary{padding-left:12px;padding-right:12px;--money-amt-col:112px}.mff-money-summary-row{grid-template-columns:minmax(0,1fr) var(--money-amt-col);column-gap:6px}.mff-money-summary-row .amt{width:var(--money-amt-col);font-size:13px}}
</style>
</head>
<body>

<div class="mff-app" style="padding-bottom:20px">

  <div class="mff-hero-wrap" style="padding-bottom:20px;border-radius:0 0 28px 28px">
    <div class="mff-topbar">
      <a class="back" href="../index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5 8 12l7 7"/></svg>
        หน้าแรก
      </a>
      <span></span>
    </div>
    <div class="mff-hero" style="padding-top:0">
      <p class="eyebrow" style="margin-bottom:2px">My Money</p>
      <h1 style="font-size:19px;white-space:nowrap">รายรับ-รายจ่ายครอบครัว</h1>
    </div>
  </div>

  <!-- 1 & 2: ค่าใช้จ่ายรายวัน / ค่าใช้จ่ายรายเดือน -->
  <div class="mff-money-hub-grid">
    <a class="mff-money-hub-tile" href="daily.html">
      <span class="ic">📆</span>
      <h3>ค่าใช้จ่ายรายวัน</h3>
      <p>บันทึกค่าใช้จ่ายแต่ละวัน แยกตามหมวดหมู่</p>
    </a>
    <a class="mff-money-hub-tile" href="monthly.html">
      <span class="ic">📊</span>
      <h3>ค่าใช้จ่ายรายเดือน</h3>
      <p>งบประมาณรายรับ-รายจ่ายทั้งเดือน</p>
    </a>
  </div>

  <!-- 3: สรุปยอด (แสดงผลอย่างเดียว ไม่ใช่ปุ่มลิงก์) -->
  <div class="mff-money-summary">
    <h2>📋 สรุปยอด</h2>

    <div class="mff-money-summary-divider">รายวัน</div>
    <div class="mff-money-summary-row">
      <span class="nm">วันนี้ใช้ไปเท่าไหร่</span>
      <span class="amt neg" id="sumDailyToday">฿0</span>
    </div>

    <div class="mff-money-summary-divider">รายเดือน (<span id="sumMonthLabel"></span>)</div>
    <div class="mff-money-summary-row">
      <span class="nm">รายรับ</span>
      <span class="amt pos" id="sumMonthIncome">฿0</span>
    </div>
    <div class="mff-money-summary-row">
      <span class="nm">รายจ่าย</span>
      <span class="amt neg" id="sumMonthExpense">฿0</span>
    </div>
    <div class="mff-money-summary-row">
      <span class="nm">ยอดคงเหลือ</span>
      <span class="amt" id="sumMonthBalance">฿0</span>
    </div>
  </div>

</div>

<script src="../config.js"></script>
<script src="../portfolio/auth-open.js"></script>
<script>
(function(){
'use strict';
function fmtBaht(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:0}); }
function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthLabelTH(key){
  const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y,m]=key.split('-').map(Number);
  return THAI_MONTHS[m-1]+' '+(y+543);
}
function readJSON(key,fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }

/* ---- สรุปรายวัน: อ่านจาก cache ของหน้า daily.html ---- */
const dailyEntries = readJSON('mff_daily_cache_v1', []);
const todayKey = dateKey(new Date());
const todayTotal = dailyEntries.filter(e=>e.date===todayKey).reduce((s,e)=>s+(Number(e.amount)||0),0);
document.getElementById('sumDailyToday').textContent = '฿'+fmtBaht(todayTotal);

/* ---- สรุปรายเดือน: อ่านจาก cache ของหน้า monthly.html ---- */
const monthItems = readJSON('mff_money_cache_v3', []);
const thisMonthKey = monthKey(new Date());
document.getElementById('sumMonthLabel').textContent = monthLabelTH(thisMonthKey);
let income=0, expense=0;
monthItems.forEach(t=>{
  if(t.month!==thisMonthKey) return;
  const amt=Number(t.amount)||0;
  if(t.type==='income') income+=amt; else expense+=amt;
});
const balance=income-expense;
document.getElementById('sumMonthIncome').textContent = '฿'+fmtBaht(income);
document.getElementById('sumMonthExpense').textContent = '฿'+fmtBaht(expense);
const balEl=document.getElementById('sumMonthBalance');
balEl.textContent = (balance<0?'-':'')+'฿'+fmtBaht(Math.abs(balance));
balEl.className = 'amt '+(balance>=0?'pos':'neg');
})();
</script>

</body>
</html>
