<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ค่าใช้จ่ายรายเดือน — My Money — My Family Funds</title>
<meta name="theme-color" content="#0F5B4D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shell.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<body>

<div class="mff-app" style="padding-bottom:20px">

  <div class="mff-hero-wrap" style="padding-bottom:20px;border-radius:0 0 28px 28px">
    <div class="mff-topbar">
      <a class="back" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5 8 12l7 7"/></svg>
        My Money
      </a>
      <span></span>
    </div>
    <div class="mff-hero" style="padding-top:0">
      <p class="eyebrow" style="margin-bottom:2px">My Money</p>
      <h1 style="font-size:19px;white-space:nowrap">ค่าใช้จ่ายรายเดือน</h1>
    </div>
  </div>

  <div id="connectBanner"></div>

  <div id="viewRoot"></div>

</div>

<script src="../config.js"></script>
<script src="../portfolio/auth-open.js"></script>
<script>
(function(){
'use strict';

/* ===================== categories — exact names from the user's real budget sheet ===================== */
const INCOME_OPTIONS=['เงินค่าจ้าง','โบนัส OIP','ดอกเบี้ย','อื่นๆ'];
const FIXED_OPTIONS=['ค่าใช้จ่ายประจำเดือน','เงินเก็บสำรองฉุกเฉิน (SCBTMPLUS-I)','เงินเก็บลูกชาย (SCBFIXEDA)','ค่าส่วนกลางบ้าน (รายปี) KKP','ฌาปนกิจ พ่อ+แม่ (รายปี) KKP','ประกันชีวิตลูก (รายปี) KKP','ประกันรถ City (รายปี) KKP','ค่าเทอม ลูกชาย (16000) KKP','ส่งให้เมีย','โอนให้แม่','โอนให้แม่ยาย','ค่าโทรศัพท์แม่','ค่าโทรศัพท์เมีย','ค่าโทรศัพท์ตัวเอง + ค่า Net บ้าน AIS Fiber','ค่าไฟฟ้า','ค่าน้ำ','บัตรเครดิต Lotus','SPayLater (Shopee)','ประกันรถ City','Service รถใหญ่','อาหารหมา','ค่าน้ำมันมอไซค์','อื่นๆ'];
const VARIABLE_OPTIONS=['กองทุนรวม (SCBAM) + WelthX','กองทุนลูกชาย (SCBAM)','เงินกองทุน RMF KKP CorePath Balanced RMF','อื่นๆ ฝาก Small bank','อื่นๆ'];

const SECTIONS=[
  {key:'income', title:'รายรับ (Income)', cls:'income', opts:INCOME_OPTIONS},
  {key:'fixed', title:'รายจ่าย (Fix Expenses)', cls:'fixed', opts:FIXED_OPTIONS},
  {key:'variable', title:'รายจ่าย (Non-Fix Expenses)', cls:'variable', opts:VARIABLE_OPTIONS},
];

/* ===================== Google Sheets sync (same pattern as Portfolio/Profile —
   separate "MoneyTransactions" tab, never touches other tabs) ===================== */
const SHEETS_SCOPE='https://www.googleapis.com/auth/spreadsheets';
const CACHE_KEY='mff_money_cache_v3';
const TAB='MoneyTransactions';
const HEADERS=['ID','Month','Type','Category','Amount','CreatedAt','UpdatedAt'];

let sheetsToken=null, sheetsTokenExpiresAt=0;
let sheetId=localStorage.getItem('google_sheet_id')||'';
let sheetsClient=null;
let items=[]; // all line items across all months: {id,month,type,category,amount,createdAt,updatedAt}
let currentMonth=monthKey(new Date());
let extraRows={income:[], fixed:[], variable:[]}; // custom category rows added inside the popup this session

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(key){
  const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const [y,m]=key.split('-').map(Number);
  return THAI_MONTHS[m-1]+' '+(y+543);
}
function shiftMonth(key,delta){
  const [y,m]=key.split('-').map(Number);
  const d=new Date(y, m-1+delta, 1);
  return monthKey(d);
}
function fmtBaht(n){ return (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:0}); }

function getGoogleClientId(){return localStorage.getItem('google_client_id')||'';}
function sheetHeaders(extra){return Object.assign({'Authorization':'Bearer '+sheetsToken},extra||{});}

function ensureSheetsClient(cid){
  if(!window.google?.accounts?.oauth2){toast('Google API ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง');return null;}
  if(!sheetsClient||sheetsClient._cid!==cid){
    sheetsClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SHEETS_SCOPE,callback:async r=>{
      if(r.error){toast('เชื่อมต่อ Google Sheets ไม่สำเร็จ');return;}
      sheetsToken=r.access_token;
      sheetsTokenExpiresAt=Date.now()+Math.max(60,(Number(r.expires_in)||3600)-60)*1000;
      localStorage.setItem('google_sheets_connected','1');
      renderConnectBanner();
      if(sheetsClient._mffResolve){const rr=sheetsClient._mffResolve;sheetsClient._mffResolve=null;rr(true);}
      try{
        await ensureMoneyTab();
        await pullItems();
        render();
        toast('เชื่อมต่อ Google Sheets แล้ว');
      }catch(e){console.error(e);toast('เชื่อมต่อได้ แต่ซิงก์ไม่สำเร็จ: '+e.message);}
    }});
    sheetsClient._cid=cid;
  }
  return sheetsClient;
}

async function ensureSheetsAccess(){
  if(sheetsToken && Date.now()<sheetsTokenExpiresAt) return true;
  const cid=getGoogleClientId(); if(!cid||!sheetId) return false;
  const c=ensureSheetsClient(cid); if(!c) return false;
  return new Promise(resolve=>{
    c._mffResolve=resolve;
    try{c.requestAccessToken({prompt:'none'});}catch(e){c._mffResolve=null;resolve(false);}
    setTimeout(()=>{if(c._mffResolve){c._mffResolve=null;resolve(!!sheetsToken);}},8000);
  });
}

async function sheetsApi(url,opts={}){
  if(!sheetsToken) throw new Error('Google Sheets ยังไม่ได้รับสิทธิ์');
  const r=await fetch(url,Object.assign({headers:sheetHeaders({'Content-Type':'application/json'})},opts));
  if(r.status===401||r.status===403){localStorage.removeItem('google_sheets_connected');sheetsToken=null;throw new Error('สิทธิ์หมดอายุ กรุณาเชื่อมต่อใหม่');}
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

async function ensureMoneyTab(){
  const meta=await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}?fields=sheets.properties`);
  const titles=(meta.sheets||[]).map(s=>s.properties.title);
  if(!titles.includes(TAB)){
    await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:[{addSheet:{properties:{title:TAB}}}]})});
    await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${TAB}!A1?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({range:`${TAB}!A1`,majorDimension:'ROWS',values:[HEADERS]})});
  }
}

function mergeById(localList, remoteList){
  const map=new Map();
  remoteList.forEach(r=>map.set(r.id, r));
  localList.forEach(l=>{
    const r=map.get(l.id);
    if(!r){ map.set(l.id, l); return; } // มีแค่ในเครื่องนี้ (ยังไม่เคย push ขึ้น Sheet) — เก็บไว้ ไม่ทิ้ง
    const lt=Date.parse(l.updatedAt)||0, rt=Date.parse(r.updatedAt)||0;
    map.set(l.id, lt>rt ? l : r); // แก้ล่าสุดที่ไหน เอาตัวนั้น (ถ้าเวลาเท่ากันถือว่า remote ตรงกันอยู่แล้ว)
  });
  return Array.from(map.values());
}
async function pullItems(force){
  const j=await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${TAB}!A:G`);
  const rows=(j.values||[]).slice(1);
  const remote=rows.filter(r=>r[0]).map(r=>({id:r[0], month:r[1]||'', type:r[2]||'', category:r[3]||'', amount:Number(r[4])||0, createdAt:r[5]||'', updatedAt:r[6]||''}));
  if(force){ items=remote; saveCache(); return; } // ผู้ใช้เลือก "ซิงก์จาก Sheet" เอง — ใช้ของ Sheet ทั้งหมด ไม่เทียบเวลา
  const merged=mergeById(items, remote);
  const needsPushBack = JSON.stringify(merged.slice().sort((a,b)=>a.id<b.id?-1:1)) !== JSON.stringify(remote.slice().sort((a,b)=>a.id<b.id?-1:1));
  items=merged;
  saveCache();
  if(needsPushBack) await pushItems(); // เครื่องนี้มีของที่ Sheet ยังไม่มี/เก่ากว่า → ซิงก์ผลรวมกลับขึ้นทันที
}

async function pushItems(){
  const values=[HEADERS].concat(items.map(t=>[t.id,t.month,t.type,t.category,t.amount,t.createdAt,t.updatedAt]));
  await ensureMoneyTab();
  await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${TAB}!A:G:clear`,{method:'POST',body:'{}'});
  await sheetsApi(`https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(sheetId)}/values/${TAB}!A1?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({range:`${TAB}!A1`,majorDimension:'ROWS',values})});
}

async function syncSave(){
  saveCache();
  if(!(await ensureSheetsAccess())){ toast('บันทึกในเครื่องนี้แล้ว • ยังไม่ได้เชื่อมต่อ Google Sheets'); renderConnectBanner(); return; }
  try{ await pushItems(); localStorage.setItem('sheet_last_sync_money', new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})); toast('บันทึกและซิงก์ Google Sheets แล้ว'); }
  catch(e){ toast('บันทึกในเครื่องแล้ว แต่ซิงก์ไม่สำเร็จ: '+e.message); }
}

/* ===================== local cache ===================== */
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(items)); }catch(e){} }
function loadCache(){ try{ const raw=localStorage.getItem(CACHE_KEY); if(raw) items=JSON.parse(raw); }catch(e){} }

/* ===================== connect banner ===================== */
function renderConnectBanner(){
  const el=document.getElementById('connectBanner');
  const connected = sheetsToken || (localStorage.getItem('google_sheets_connected')==='1' && sheetId);
  if(!connected){
    el.innerHTML=`
      <div class="mff-banner">
        <div><b>ยังไม่เชื่อมต่อ Google Sheets</b>ข้อมูลจะบันทึกในเครื่องนี้เท่านั้นจนกว่าจะเชื่อมต่อ</div>
        <button id="connectBtn" type="button">เชื่อมต่อ</button>
      </div>`;
    document.getElementById('connectBtn').onclick=openConnectForm;
    return;
  }
  const lastSync=localStorage.getItem('sheet_last_sync_money');
  el.innerHTML=`
    <div class="mff-sync-bar">
      <div class="mff-sync-bar-status">☁️ เชื่อมต่อ Google Sheets แล้ว${lastSync?(' • ซิงก์ล่าสุด '+esc(lastSync)):''}</div>
      <div class="mff-sync-bar-actions">
        <a href="../settings/index.html" class="mff-sync-bar-btn" style="text-decoration:none;display:inline-block">จัดการซิงก์ที่ Setting</a>
      </div>
    </div>`;
}
function openConnectForm(){
  const cid=localStorage.getItem('google_client_id')||'';
  const sid=sheetId||'';
  const html=`
    <div class="mff-field-row"><div class="lbl">Client ID</div><input id="cfCid" value="${esc(cid)}" placeholder="วาง Google OAuth Client ID"></div>
    <div class="mff-field-row"><div class="lbl">Sheet ID</div><input id="cfSid" value="${esc(sid)}" placeholder="ใช้ Spreadsheet ID เดียวกับ My Portfolio"></div>
    <p style="font-size:11.5px;color:var(--ink-soft);padding:0 0 6px">ใช้ Client ID / Sheet ID ชุดเดียวกับที่ตั้งค่าไว้ในโมดูลอื่นได้เลย ข้อมูลจะไปอยู่คนละแท็บ (MoneyTransactions) ไม่ทับข้อมูลเดิม</p>
  `;
  modal('เชื่อมต่อ Google Sheets', html, [
    {label:'ยกเลิก', ghost:true, onClick:closeModal},
    {label:'เชื่อมต่อ', onClick:async()=>{
      const cid=document.getElementById('cfCid').value.trim();
      const sid=document.getElementById('cfSid').value.trim();
      if(!cid||!sid){ toast('กรุณากรอกให้ครบ'); return; }
      localStorage.setItem('google_client_id',cid);
      sheetId=sid; localStorage.setItem('google_sheet_id',sid);
      closeModal();
      const c=ensureSheetsClient(cid);
      if(c) c.requestAccessToken({prompt:'consent'});
    }}
  ]);
}

/* ===================== tiny modal + toast helpers ===================== */
function modal(title, bodyHtml, buttons, opts){
  closeModal();
  const d=document.createElement('div');
  d.id='mffModal';
  d.style.cssText='position:fixed;inset:0;z-index:5000;background:rgba(20,33,29,.45);display:flex;align-items:flex-end;justify-content:center';
  d.innerHTML=`<div style="width:100%;max-width:460px;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;display:flex;flex-direction:column">
    <h3 style="margin:0 0 12px;font-size:17px;flex:none">${esc(title)}</h3>
    <div id="mffModalBody" style="flex:1;min-height:0">${bodyHtml}</div>
    <div style="display:flex;gap:10px;margin-top:14px;flex:none" id="mffModalBtns"></div>
  </div>`;
  document.body.appendChild(d);
  const btnWrap=document.getElementById('mffModalBtns');
  buttons.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='mff-btn '+(b.ghost?'mff-btn-ghost':'mff-btn-primary');
    btn.textContent=b.label;
    btn.onclick=b.onClick;
    btnWrap.appendChild(btn);
  });
  if(!opts||!opts.persistent){
    d.addEventListener('click',e=>{ if(e.target===d) closeModal(); });
  }
}
function closeModal(){ document.getElementById('mffModal')?.remove(); }
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function uuid(){return 'm_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}
function toast(msg){
  let t=document.getElementById('mffToast');
  if(!t){ t=document.createElement('div'); t.id='mffToast';
    t.style.cssText='position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#14211D;color:#fff;padding:10px 16px;border-radius:999px;font-size:12.5px;z-index:6500;opacity:0;transition:opacity .2s;max-width:85vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(toast._tm); toast._tm=setTimeout(()=>{t.style.opacity='0';},2600);
}

/* ===================== derived data ===================== */
function itemsFor(month, type){ return items.filter(t=>t.month===month && t.type===type); }
function sumOf(arr){ return arr.reduce((s,t)=>s+(Number(t.amount)||0),0); }
function amountOf(month,type,category){
  const hit=items.find(t=>t.month===month && t.type===type && t.category===category);
  return hit?Number(hit.amount)||0:0;
}
function allCategoriesFor(sec, month){
  // predefined list first, then any custom categories already saved for this month that aren't in the list
  const saved=itemsFor(month, sec.key).map(t=>t.category);
  const extras=saved.filter(c=>!sec.opts.includes(c));
  return sec.opts.concat(extras.filter((c,i)=>extras.indexOf(c)===i));
}

/* ===================== rendering (main page) ===================== */
function render(){
  const root=document.getElementById('viewRoot');
  const income=itemsFor(currentMonth,'income');
  const fixed=itemsFor(currentMonth,'fixed');
  const variable=itemsFor(currentMonth,'variable');
  const totalIncome=sumOf(income);
  const totalExpense=sumOf(fixed)+sumOf(variable);
  const balance=totalIncome-totalExpense;

  root.innerHTML=`
    <div class="mff-month-nav">
      <button id="prevMonth" aria-label="เดือนก่อนหน้า"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5 8 12l7 7"/></svg></button>
      <div class="label">${monthLabel(currentMonth)}</div>
      <button id="nextMonth" aria-label="เดือนถัดไป"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>

    <div class="mff-money-tabs">
      <div class="mff-money-tab income"><div class="t-lbl">รายรับ</div><div class="t-amt">฿${fmtBaht(totalIncome)}</div></div>
      <div class="mff-money-tab expense"><div class="t-lbl">รายจ่าย</div><div class="t-amt">฿${fmtBaht(totalExpense)}</div></div>
      <div class="mff-money-tab balance"><div class="t-lbl">ยอดคงเหลือ</div><div class="t-amt ${balance>=0?'pos':'neg'}">${balance<0?'-':''}฿${fmtBaht(Math.abs(balance))}</div></div>
    </div>

    <button class="mff-edit-trigger" id="editBtn">แก้ไข</button>

    ${SECTIONS.map(sec=>renderSheetSection(sec, {income,fixed,variable}[sec.key])).join('')}

    <div class="mff-sheet">
      <div class="mff-sheet-head summary">สรุป</div>
      <div class="mff-sheet-row total"><span class="nm">รายรับรวม</span><span class="amt">฿${fmtBaht(totalIncome)}</span></div>
      <div class="mff-sheet-row total"><span class="nm">รายจ่ายรวม</span><span class="amt">฿${fmtBaht(totalExpense)}</span></div>
      <div class="mff-sheet-row total"><span class="nm">ยอดคงเหลือ</span><span class="amt ${balance>=0?'pos':'neg'}">${balance<0?'-':''}฿${fmtBaht(Math.abs(balance))}</span></div>
    </div>
  `;

  document.getElementById('prevMonth').onclick=()=>{ currentMonth=shiftMonth(currentMonth,-1); render(); };
  document.getElementById('nextMonth').onclick=()=>{ currentMonth=shiftMonth(currentMonth,1); render(); };
  document.getElementById('editBtn').onclick=openEditPopup;
}

function renderSheetSection(sec, rows){
  const total=sumOf(rows);
  const cats=allCategoriesFor(sec, currentMonth);
  const nonZero=cats.filter(c=>amountOf(currentMonth,sec.key,c)>0);
  const shown = nonZero.length ? nonZero : [];
  return `
    <div class="mff-sheet">
      <div class="mff-sheet-head ${sec.cls}">${sec.title}</div>
      ${shown.length? shown.map(c=>`<div class="mff-sheet-row"><span class="nm">${esc(c)}</span><span class="amt">฿${fmtBaht(amountOf(currentMonth,sec.key,c))}</span></div>`).join('')
        : `<div class="mff-sheet-row"><span class="nm" style="color:var(--ink-faint)">ยังไม่มีรายการเดือนนี้ — กด "แก้ไข" เพื่อกรอกข้อมูล</span></div>`}
      <div class="mff-sheet-row total"><span class="nm">รวม</span><span class="amt">฿${fmtBaht(total)}</span></div>
    </div>`;
}

/* ===================== edit-all popup (bespoke DOM — scrollable middle,
   pinned header/footer, so it never overflows the screen) ===================== */
function openEditPopup(){
  closeModal();
  const d=document.createElement('div');
  d.id='mffModal';
  d.style.cssText='position:fixed;inset:0;z-index:5000;background:rgba(20,33,29,.45);display:flex;align-items:flex-end;justify-content:center';
  d.innerHTML=`
    <div style="width:100%;max-width:460px;max-height:86vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden">
      <h3 style="margin:0;padding:18px 20px 12px;font-size:16px;flex:none;border-bottom:1px solid var(--line)">แก้ไขข้อมูลเดือน ${esc(monthLabel(currentMonth))}</h3>
      <div id="mffModalBody" style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px">
        ${SECTIONS.map(sec=>editSectionHtml(sec)).join('')}
        <div style="height:8px"></div>
      </div>
      <div class="mff-modal-live-summary" style="flex:none;padding:10px 20px 0;margin:0">
        <span>ยอดคงเหลือ (คำนวณสด)</span>
        <span id="liveBalance">฿0</span>
      </div>
      <div style="display:flex;gap:10px;flex:none;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px))">
        <button class="mff-btn mff-btn-ghost" id="popupCancel">ยกเลิก</button>
        <button class="mff-btn mff-btn-primary" id="popupSave">บันทึกข้อมูล</button>
      </div>
    </div>`;
  document.body.appendChild(d);
  d.addEventListener('click',e=>{ if(e.target===d) closeModal(); });
  document.getElementById('popupCancel').onclick=closeModal;
  document.getElementById('popupSave').onclick=saveEditPopup;

  wireLiveSummary();
}

function editSectionHtml(sec){
  const cats=allCategoriesFor(sec, currentMonth);
  return `
    <div class="mff-modal-section-head ${sec.cls}">${sec.title}</div>
    <div class="edit-rows" data-type="${sec.key}">
      ${cats.map(c=>`
        <div class="mff-modal-row" data-cat="${esc(c)}">
          <span class="nm">${esc(c)}</span>
          <input type="number" inputmode="decimal" class="edit-amt" placeholder="0" value="${amountOf(currentMonth,sec.key,c)||''}">
        </div>`).join('')}
    </div>
    <button type="button" class="mff-modal-add-row" data-addcustom="${sec.key}">+ เพิ่มรายการอื่นๆ ในหมวดนี้</button>
  `;
}

function wireLiveSummary(){
  const root=document.getElementById('mffModalBody');
  function recalc(){
    let inc=0, exp=0;
    root.querySelectorAll('.edit-rows[data-type="income"] .edit-amt').forEach(i=>inc+=parseFloat(i.value)||0);
    root.querySelectorAll('.edit-rows[data-type="fixed"] .edit-amt').forEach(i=>exp+=parseFloat(i.value)||0);
    root.querySelectorAll('.edit-rows[data-type="variable"] .edit-amt').forEach(i=>exp+=parseFloat(i.value)||0);
    const bal=inc-exp;
    const el=document.getElementById('liveBalance');
    if(el){ el.textContent=(bal<0?'-':'')+'฿'+fmtBaht(Math.abs(bal)); el.style.color = bal>=0?getCss('--income'):getCss('--expense'); }
  }
  root.addEventListener('input', e=>{ if(e.target.classList.contains('edit-amt')) recalc(); });
  root.querySelectorAll('[data-addcustom]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const type=btn.dataset.addcustom;
      const name=prompt('ตั้งชื่อรายการใหม่:');
      if(!name||!name.trim()) return;
      const rowsWrap=root.querySelector(`.edit-rows[data-type="${type}"]`);
      const row=document.createElement('div');
      row.className='mff-modal-row';
      row.dataset.cat=name.trim();
      row.innerHTML=`<span class="nm">${esc(name.trim())}</span><input type="number" inputmode="decimal" class="edit-amt" placeholder="0">`;
      rowsWrap.appendChild(row);
    });
  });
  recalc();
}
function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }

async function saveEditPopup(){
  const root=document.getElementById('mffModalBody');
  const now=new Date().toISOString();
  const newRowsForMonth=[];
  SECTIONS.forEach(sec=>{
    root.querySelectorAll(`.edit-rows[data-type="${sec.key}"] .mff-modal-row`).forEach(rowEl=>{
      const category=rowEl.dataset.cat;
      const amount=parseFloat(rowEl.querySelector('.edit-amt').value)||0;
      if(!category || !amount) return;
      const existing=items.find(t=>t.month===currentMonth && t.type===sec.key && t.category===category);
      newRowsForMonth.push({
        id: existing?existing.id:uuid(), month:currentMonth, type:sec.key, category, amount,
        createdAt: existing?existing.createdAt:now, updatedAt: now
      });
    });
  });
  items = items.filter(t=>t.month!==currentMonth).concat(newRowsForMonth);
  closeModal();
  render();
  await syncSave();
}

/* ===================== boot ===================== */
loadCache();
renderConnectBanner();
render();

window.addEventListener('load', async ()=>{
  const cid=getGoogleClientId();
  if(cid && localStorage.getItem('google_sheets_connected')==='1' && sheetId){
    const ok=await ensureSheetsAccess();
    if(ok){
      try{ await ensureMoneyTab(); await pullItems(); render(); renderConnectBanner(); }
      catch(e){ console.warn('Money auto sync failed', e); }
    }
  }
});

})();
